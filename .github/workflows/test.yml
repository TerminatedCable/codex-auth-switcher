name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout exact commit
        shell: powershell
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Run dependency-free tests
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1
